<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Pretty String Renderer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div id="app">
        <!-- Header -->
        <header id="hd">
            <span class="logo">Pretty String Renderer</span>
            <div class="sp"></div>
            <div class="badge">3120 x 780 · 4:1</div>
            <button id="btn-export">↓ Export</button>
        </header>

        <!-- Sidebar -->
        <aside id="sb">

            <!-- THEMES -->
            <div>
                <div class="sh">Themes<span class="chv">▾</span></div>
                <div class="sbody">
                    <div id="theme-list">
                        <div id="theme-empty">No themes loaded.</div>
                    </div>
                    <button id="btn-load-themes" class="theme-btn">Load themes</button>
                    <button id="btn-export-theme" class="theme-btn">Export theme</button>
                </div>
            </div>
            <div class="sep"></div>

            <!-- BRACKET COLORS -->
            <div>
                <div class="sh">Bracket Colors<span class="chv">▾</span></div>
                <div class="sbody">
                    <div class="row"><label>Level 1</label>
                        <div class="sw">
                            <div class="swf" id="sf-bracket0"></div><input type="color" id="cp-bracket0" />
                        </div>
                        <input class="hx" id="hx-bracket0" maxlength="7" />
                    </div>
                    <div class="row"><label>Level 2</label>
                        <div class="sw">
                            <div class="swf" id="sf-bracket1"></div><input type="color" id="cp-bracket1" />
                        </div>
                        <input class="hx" id="hx-bracket1" maxlength="7" />
                    </div>
                    <div class="row"><label>Level 3</label>
                        <div class="sw">
                            <div class="swf" id="sf-bracket2"></div><input type="color" id="cp-bracket2" />
                        </div>
                        <input class="hx" id="hx-bracket2" maxlength="7" />
                    </div>
                </div>
            </div>
            <div class="sep"></div>

            <!-- SYNTAX COLORS -->
            <div>
                <div class="sh">Syntax Colors<span class="chv">▾</span></div>
                <div class="sbody">
                    <div class="row"><label>Function</label>
                        <div class="sw">
                            <div class="swf" id="sf-function"></div><input type="color" id="cp-function" />
                        </div>
                        <input class="hx" id="hx-function" maxlength="7" />
                    </div>
                    <div class="row"><label>Variable</label>
                        <div class="sw">
                            <div class="swf" id="sf-variable"></div><input type="color" id="cp-variable" />
                        </div>
                        <input class="hx" id="hx-variable" maxlength="7" />
                    </div>
                    <div class="row"><label>Operator</label>
                        <div class="sw">
                            <div class="swf" id="sf-operator"></div><input type="color" id="cp-operator" />
                        </div>
                        <input class="hx" id="hx-operator" maxlength="7" />
                    </div>
                    <div class="row"><label>Semicolon</label>
                        <div class="sw">
                            <div class="swf" id="sf-semicolon"></div><input type="color" id="cp-semicolon" />
                        </div>
                        <input class="hx" id="hx-semicolon" maxlength="7" />
                    </div>
                    <div class="row"><label>Number</label>
                        <div class="sw">
                            <div class="swf" id="sf-number"></div><input type="color" id="cp-number" />
                        </div>
                        <input class="hx" id="hx-number" maxlength="7" />
                    </div>
                    <div class="row"><label>Comment (#)</label>
                        <div class="sw">
                            <div class="swf" id="sf-comment"></div><input type="color" id="cp-comment" />
                        </div>
                        <input class="hx" id="hx-comment" maxlength="7" />
                    </div>
                    <div class="row"><label>Unknown</label>
                        <div class="sw">
                            <div class="swf" id="sf-unknown"></div><input type="color" id="cp-unknown" />
                        </div>
                        <input class="hx" id="hx-unknown" maxlength="7" />
                    </div>
                </div>
            </div>
            <div class="sep"></div>

            <!-- CANVAS -->
            <div>
                <div class="sh">Canvas<span class="chv">▾</span></div>
                <div class="sbody">
                    <div class="row"><label>Background</label>
                        <div class="sw">
                            <div class="swf" id="sf-background"></div><input type="color" id="cp-background" />
                        </div>
                        <input class="hx" id="hx-background" maxlength="7" />
                    </div>
                </div>
            </div>
            <div class="sep"></div>

            <!-- TYPOGRAPHY -->
            <div>
                <div class="sh">Typography<span class="chv">▾</span></div>
                <div class="sbody">
                    <div class="row"><label>Font size px</label>
                        <input class="ni" type="number" id="c-fs" value="85" min="6" max="300" />
                    </div>
                    <div class="row"><label>Line height</label>
                        <input class="ni" type="number" id="c-lh" value="1.15" min="0.8" max="4" step="0.01" />
                    </div>
                    <div class="row"><label>Letter spacing</label>
                        <input class="ni" type="number" id="c-ls" value="0" min="-10" max="50" step="0.5" />
                    </div>
                    <div class="row"><label>Padding X px</label>
                        <input class="ni" type="number" id="c-px" value="64" min="0" max="400" />
                    </div>
                    <div class="row"><label>Padding Y px</label>
                        <input class="ni" type="number" id="c-py" value="4" min="0" max="400" />
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main id="mn">
            <div id="canvas-wrap">
                <div id="canvas-inner">
                    <canvas id="canvas"></canvas>
                </div>
            </div>
            <div id="rh"></div>
            <div id="ed-panel">
                <div id="ed-tabs">
                    <div class="tab">Editor</div>
                    <div class="edfont">
                        <span>editor px</span>
                        <input class="ni" type="number" id="ed-fs" value="16" min="8" max="36" />
                    </div>
                    <span id="si"></span>
                </div>
                <textarea id="ed" spellcheck="false">                                       /        /      *B2 \\
                                       ▏        \(en())    /▕
                                       ▏/ dev; \            ▕
                                       ▏▏ ──── ▕            ▕
                                       \\ solv /            /
/           —**r_(on)ie[l] + saba(la) \
▏/       _ \                          ▕
\\((_)++)  /                          /</textarea>
            </div>
        </main>
    </div>
    <script type="module" src="js/app.js"></script>
</body>

</html>
