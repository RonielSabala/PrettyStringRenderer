<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Pretty String Renderer</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/section.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/inputs.css">
    <link rel="stylesheet" href="css/canvas.css">
    <link rel="stylesheet" href="css/editor.css">
</head>

<body>
    <div id="app">
        <!-- Header -->
        <header id="app-header">
            <span class="header-title">Pretty String Renderer</span>
            <div class="header-title-separator"></div>
            <div class="badge" id="header-badge"></div>
            <button id="btn-export">↓ Export</button>
        </header>

        <!-- Sidebar -->
        <aside id="app-sidebar">
            <!-- Themes -->
            <div>
                <div class="section-header" id="section-themes">Themes<span class="accordion-control">▾</span></div>
                <div class="section-body">
                    <div id="theme-list">
                        <div id="theme-empty">No themes loaded.</div>
                    </div>
                    <button id="btn-load-themes" class="theme-btn">Load themes</button>
                    <button id="btn-export-theme" class="theme-btn">Export theme</button>
                </div>
            </div>

            <div class="section-separator"></div>

            <!-- Bracket colors -->
            <div>
                <div class="section-header" id="section-bracket-colors">Bracket Colors<span
                        class="accordion-control">▾</span></div>
                <div class="section-body">
                    <div class="row"><label>Level 1</label>
                        <div class="swatch">
                            <div class="swatch-fill" id="swatch-fill-bracket0"></div><input type="color"
                                id="color-picker-bracket0" />
                        </div>
                        <input class="hex-input" id="hex-input-bracket0" maxlength="7" />
                    </div>
                    <div class="row"><label>Level 2</label>
                        <div class="swatch">
                            <div class="swatch-fill" id="swatch-fill-bracket1"></div><input type="color"
                                id="color-picker-bracket1" />
                        </div>
                        <input class="hex-input" id="hex-input-bracket1" maxlength="7" />
                    </div>
                    <div class="row"><label>Level 3</label>
                        <div class="swatch">
                            <div class="swatch-fill" id="swatch-fill-bracket2"></div><input type="color"
                                id="color-picker-bracket2" />
                        </div>
                        <input class="hex-input" id="hex-input-bracket2" maxlength="7" />
                    </div>
                </div>
            </div>

            <div class="section-separator"></div>

            <!-- Syntax colors -->
            <div>
                <div class="section-header" id="section-syntax-colors">Syntax Colors<span
                        class="accordion-control">▾</span></div>
                <div class="section-body">
                    <div class="row"><label>Function</label>
                        <div class="swatch">
                            <div class="swatch-fill" id="swatch-fill-function"></div><input type="color"
                                id="color-picker-function" />
                        </div>
                        <input class="hex-input" id="hex-input-function" maxlength="7" />
                    </div>
                    <div class="row"><label>Variable</label>
                        <div class="swatch">
                            <div class="swatch-fill" id="swatch-fill-variable"></div><input type="color"
                                id="color-picker-variable" />
                        </div>
                        <input class="hex-input" id="hex-input-variable" maxlength="7" />
                    </div>
                    <div class="row"><label>Operator</label>
                        <div class="swatch">
                            <div class="swatch-fill" id="swatch-fill-operator"></div><input type="color"
                                id="color-picker-operator" />
                        </div>
                        <input class="hex-input" id="hex-input-operator" maxlength="7" />
                    </div>
                    <div class="row"><label>Semicolon</label>
                        <div class="swatch">
                            <div class="swatch-fill" id="swatch-fill-semicolon"></div><input type="color"
                                id="color-picker-semicolon" />
                        </div>
                        <input class="hex-input" id="hex-input-semicolon" maxlength="7" />
                    </div>
                    <div class="row"><label>Number</label>
                        <div class="swatch">
                            <div class="swatch-fill" id="swatch-fill-number"></div><input type="color"
                                id="color-picker-number" />
                        </div>
                        <input class="hex-input" id="hex-input-number" maxlength="7" />
                    </div>
                    <div class="row"><label>Comment (#)</label>
                        <div class="swatch">
                            <div class="swatch-fill" id="swatch-fill-comment"></div><input type="color"
                                id="color-picker-comment" />
                        </div>
                        <input class="hex-input" id="hex-input-comment" maxlength="7" />
                    </div>
                    <div class="row"><label>Unknown</label>
                        <div class="swatch">
                            <div class="swatch-fill" id="swatch-fill-unknown"></div><input type="color"
                                id="color-picker-unknown" />
                        </div>
                        <input class="hex-input" id="hex-input-unknown" maxlength="7" />
                    </div>
                </div>
            </div>

            <div class="section-separator"></div>

            <!-- Canvas colors -->
            <div>
                <div class="section-header" id="section-canvas-colors">Canvas Colors<span
                        class="accordion-control">▾</span></div>
                <div class="section-body">
                    <div class="row"><label>Background</label>
                        <div class="swatch">
                            <div class="swatch-fill" id="swatch-fill-background"></div><input type="color"
                                id="color-picker-background" />
                        </div>
                        <input class="hex-input" id="hex-input-background" maxlength="7" />
                    </div>
                </div>
            </div>

            <div class="section-separator"></div>

            <!-- Typography -->
            <div>
                <div class="section-header" id="section-typography">Typography<span class="accordion-control">▾</span>
                </div>
                <div class="section-body">
                    <div class="row"><label>Font size (px)</label>
                        <input class="number-input" type="number" id="typography-font-size" />
                    </div>
                    <div class="row"><label>Line height</label>
                        <input class="number-input" type="number" id="typography-line-height" />
                    </div>
                    <div class="row"><label>Letter spacing</label>
                        <input class="number-input" type="number" id="typography-letter-spacing" />
                    </div>
                    <div class="row"><label>Padding X (px)</label>
                        <input class="number-input" type="number" id="typography-pad-x" />
                    </div>
                    <div class="row"><label>Padding Y (px)</label>
                        <input class="number-input" type="number" id="typography-pad-y" />
                    </div>
                </div>
            </div>
        </aside>

        <!-- Work area -->
        <main id="app-work-area">
            <!-- Canvas -->
            <div id="canvas-wrap" tabindex="-1">
                <div id="canvas-inner">
                    <canvas id="canvas"></canvas>
                </div>
            </div>

            <!-- Resize handle -->
            <div id="editor-resize-handle"></div>

            <!-- Editor area -->
            <div id="editor-panel">
                <div id="editor-tabs">
                    <div class="tab">Editor</div>
                    <div class="editor-font">
                        <span>Font size (px)</span>
                        <input class="number-input" type="number" id="editor-font-size" />
                    </div>
                    <span id="editor-status"></span>
                </div>

                <!-- Editor -->
                <textarea id="editor" spellcheck="false"></textarea>
            </div>
        </main>
    </div>
    <script type="module" src="js/app.js"></script>
</body>

</html>
